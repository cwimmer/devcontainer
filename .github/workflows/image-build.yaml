---
name: Build Multi-Architecture Container Image

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image for local testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/cwimmer/devcontainer:latest
          platforms: linux/amd64

      - name: Run BATS suite against locally-built image
        run: |
          docker run --rm --pull=never \
            -e ASDF_BATS_VERSION=1.14.0 \
            -v ${{ github.workspace }}:/repo \
            -w /repo/tests \
            ghcr.io/cwimmer/devcontainer:latest \
            bats \
              test-bats-support.bats \
              test-gh-support.bats \
              test-opencode-support.bats \
              test-file-support.bats

      - name: Build and push base multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/cwimmer/devcontainer:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push OpenCode multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.OpenCode
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/cwimmer/devcontainer:opencode
          platforms: linux/amd64,linux/arm64

      - name: Build OpenCode v2 image for native verification
        id: build_opencode2_native
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile.OpenCode2
          tags: ghcr.io/cwimmer/devcontainer:opencode2
          platforms: linux/amd64
          pull: true
          load: true

      - name: Verify OpenCode v2 image
        id: verify_opencode2
        run: >-
          sh scripts/verify-opencode2.sh
          ghcr.io/cwimmer/devcontainer:opencode2
        timeout-minutes: 20

      - name: Build and push OpenCode v2 multi-architecture image
        id: publish_opencode2
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.OpenCode2
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/cwimmer/devcontainer:opencode2
          platforms: linux/amd64,linux/arm64
          pull: true
